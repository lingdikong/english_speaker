[package]
name = "es-runtime"
description = "Composition root: wires concrete adapters into es-core AppCore. Shared by FFI and desktop."
version.workspace = true
edition.workspace = true

[dependencies]
es-core.workspace = true
es-audio.workspace = true
es-storage.workspace = true
es-tts-kokoro.workspace = true
es-translate = { workspace = true, default-features = false }
log.workspace = true

[features]
default = ["llm"]
# 智能翻译（Qwen，llama.cpp）。关闭后只有机器翻译与离线词典。
llm = ["es-translate/llm"]
